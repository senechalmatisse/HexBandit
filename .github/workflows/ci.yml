# Intégration continue : Rust de rust-toolchain.toml (référence 1.100.0)
# et version minimale déclarée (rust-version) ;
# Python 3.15.2 (référence du cahier des charges) et 3.11 (plus ancienne version prise en charge).

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy (erreurs)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unitaires, propriétés, contrat, golden, doctests)
        run: cargo test --workspace
      - name: Empreintes multiplateformes (déterminisme, ADR 0006)
        run: cargo test -p mcts --test fingerprint --test engine --test v2_features
      - name: Logarithme interne contre la glibc (toutes les valeurs f32)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p game-core --release -- --ignored
      - name: Banc de performance
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p mcts
        env:
          HEXBANDIT_BENCH_SIMS: "20000"
          HEXBANDIT_BENCH_REPEAT: "3"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version minimale (rust-version du workspace)
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace --all-targets

  python:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.15.2"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliothèque native
        run: bash scripts/hexlXtc01.sh release
      - name: Environnement verrouillé
        working-directory: python
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "::warning::uv.lock absent : produit ici, à versionner (artefact uv-lock)"
            uv lock
          fi
          uv sync --extra dev --extra parquet --extra crosscheck
      - name: Verrou à versionner
        if: hashFiles('python/uv.lock') != '' && matrix.os == 'ubuntu-latest' && matrix.python == '3.15.2'
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: python/uv.lock
      - name: Compatibilité des bibliothèques
        working-directory: python
        run: |
          uv pip check
          uv run python -c "import numpy, pandas, scipy, statsmodels, matplotlib, pyarrow, pydantic, hexbandit, hexbandit.experiments.plots, hexbandit.viz; print('pile OK')"
      - name: Ruff
        working-directory: python
        run: uv run ruff check hexbandit tests
      - name: Mypy (strict)
        working-directory: python
        run: uv run mypy
      - name: Pytest
        working-directory: python
        run: uv run pytest -q
      - name: Déterminisme multiplateforme des parties (hexbandit verify)
        working-directory: python
        run: >
          uv run python -m hexbandit verify ../experiments/campagne_reduite.toml
          --results ../experiments/verification/reduite --chunks 6 --threads 1


  wheels:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils de construction
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Roue de la plateforme (py3-none-<plateforme>)
        run: bash scripts/hexlXtc04.sh dist
      - name: Essai de la roue dans un environnement neuf
        run: |
          python -m venv /tmp/essai
          if [ -x /tmp/essai/bin/python ]; then py=/tmp/essai/bin/python; else py=/tmp/essai/Scripts/python; fi
          "$py" -m pip install dist/*.whl
          "$py" -m hexbandit --version
          "$py" -m hexbandit play --size 5 --blue rave:200 --red uct:200 --report none
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
